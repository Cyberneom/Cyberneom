name: cyberneom
description: Guided meditation with your own voice
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 2.0.2+24 # Incrementé un número el build por buena práctica

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

