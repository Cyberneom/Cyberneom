  # --- Third Party ---
  home_widget: ^0.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  dependency_validator: ^5.0.2
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  image_path: "assets/appIcon.png"
  android: true
  ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

flutter:
  uses-material-design: true

  fonts:
    - family: Open-Sans
      fonts:
        - asset: assets/fonts/OpenSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/OpenSans-Light.ttf
          weight: 300
        - asset: assets/fonts/OpenSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/OpenSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/OpenSans-ExtraBold.ttf
          weight: 800

  assets:
    - assets/
    - assets/elements/
    - assets/fonts/
    - assets/images/
    - assets/images/directory/
    - assets/images/eventType/
    - assets/event_activities/
    - assets/images/music_player/
    - assets/images/music_player/xtras/
    - assets/images/rating/
    - assets/images/release_upload/
    - assets/logos/
    - assets/logos/third-party/
    - assets/sounds/
    - assets/properties.json
    - assets/frequencies.json