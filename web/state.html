<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#000;color:#fff;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:flex;align-items:center;justify-content:center;position:relative}
#pulse{position:absolute;inset:0;pointer-events:none;transition:background .8s}
.step{display:none;flex-direction:column;align-items:center;text-align:center;padding:2rem;max-width:420px;width:100%;z-index:1}
.step.active{display:flex}
.icon{font-size:4rem;margin-bottom:1.5rem}
h1{font-size:1.8rem;font-weight:700;margin-bottom:.5rem}
.desc{color:rgba(255,255,255,.7);font-size:1rem;line-height:1.5;margin-bottom:2.5rem}
.hint{display:flex;align-items:center;gap:.5rem;color:rgba(255,255,255,.4);font-size:.9rem;margin-bottom:.5rem}
.hint svg{width:20px;height:20px;fill:currentColor}
.hint.warn{color:#ffc107}
.begin-btn{width:200px;height:56px;border-radius:28px;border:none;font-size:1.1rem;font-weight:700;cursor:pointer;transition:transform .15s}
.begin-btn:active{transform:scale(.95)}
.social{color:rgba(255,255,255,.25);font-size:.85rem;margin-top:2rem}
.limit-msg{color:rgba(255,255,255,.5);font-size:.95rem;line-height:1.6;margin-bottom:1rem}
.pro-btn{background:#ffc107;color:#000;border:none;padding:.75rem 2rem;border-radius:8px;font-weight:700;font-size:1rem;cursor:pointer}
/* Player */
#player .timer{font-size:3rem;font-weight:200;letter-spacing:.1em;opacity:.7}
#player .progress-wrap{position:fixed;bottom:0;left:0;right:0;height:3px;background:rgba(255,255,255,.1)}
#player .progress-bar{height:100%;width:0;transition:width 1s linear}
#player .pause-icon{font-size:4rem;opacity:0;transition:opacity .3s}
#player .pause-icon.show{opacity:.5}
#player .stop-hint{position:fixed;bottom:20px;left:0;right:0;text-align:center;color:rgba(255,255,255,.2);font-size:.8rem}
/* Afterglow */
.emoji-row{display:flex;gap:1rem;margin-bottom:3rem}
.emoji-row span{font-size:2.5rem;cursor:pointer;transition:transform .15s}
.emoji-row span:active{transform:scale(1.3)}
.outline-btn{background:none;border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.7);padding:.75rem 1.5rem;border-radius:8px;font-size:.95rem;cursor:pointer;display:flex;align-items:center;gap:.5rem;margin-bottom:.75rem}
.text-btn{background:none;border:none;color:rgba(255,255,255,.4);font-size:.9rem;cursor:pointer;margin-bottom:2rem}
.room-box{padding:1rem;border-radius:12px;margin-bottom:1rem;text-align:center}
.room-box p{color:rgba(255,255,255,.6);font-size:.9rem}
.room-box a{font-size:.85rem;cursor:pointer}
.pro-box{padding:1rem;border:1px solid rgba(255,255,255,.08);border-radius:12px;text-align:center}
.pro-box p{color:rgba(255,255,255,.45);font-size:.9rem;margin-bottom:.75rem}
</style>
</head>

// ─── FIREBASE (lightweight REST, no SDK) ───────────────────
const FB='https://firestore.googleapis.com/v1/projects/cyberneom-edd2d/databases/(default)/documents';
function fbInc(stateId,fields){
  // Firestore REST commit with FieldTransform increments
  const transforms=Object.entries(fields).map(([k,v])=>({fieldPath:k,increment:{integerValue:String(v)}}));
  fetch('https://firestore.googleapis.com/v1/projects/cyberneom-edd2d/databases/(default)/documents:commit',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({writes:[{transform:{document:`projects/cyberneom-edd2d/databases/(default)/documents/state_usage/${stateId}`,fieldTransforms:transforms}}]})
  }).catch(()=>{});
}
function fbGet(stateId){
  return fetch(`${FB}/state_usage/${stateId}`).then(r=>r.json()).then(d=>{
    const t=d.fields?.total?.integerValue;
    return t?parseInt(t):0;
  }).catch(()=>0);
}

// ─── AUDIO ENGINE ──────────────────────────────────────────
let ctx,oscL,oscR,gainL,gainR,merger,master;
function audioPlay(lf,rf){
  ctx=new AudioContext();
  master=ctx.createGain();master.gain.value=0;master.connect(ctx.destination);
  merger=ctx.createChannelMerger(2);merger.connect(master);
  gainL=ctx.createGain();gainL.gain.value=1;gainL.connect(merger,0,0);
  oscL=ctx.createOscillator();oscL.type='sine';oscL.frequency.value=lf;oscL.connect(gainL);oscL.start();
  gainR=ctx.createGain();gainR.gain.value=1;gainR.connect(merger,0,1);
  oscR=ctx.createOscillator();oscR.type='sine';oscR.frequency.value=rf;oscR.connect(gainR);oscR.start();
  // 3s fade in
  master.gain.setValueAtTime(0,ctx.currentTime);
  master.gain.linearRampToValueAtTime(.7,ctx.currentTime+3);
}
function audioUpdate(lf,rf){if(oscL)oscL.frequency.value=lf;if(oscR)oscR.frequency.value=rf;}
function audioFadeStop(){
  if(!master||!ctx)return Promise.resolve();
  const now=ctx.currentTime;
  master.gain.setValueAtTime(master.gain.value,now);
  master.gain.linearRampToValueAtTime(0,now+3);
  return new Promise(r=>setTimeout(()=>{try{oscL.stop();oscR.stop();}catch(e){}ctx.close().catch(()=>{});ctx=null;r();},3100));
}

// ─── PULSE ANIMATION ───────────────────────────────────────
let pulseAF,pulseFq=0,pulseCol='#000';
function startPulse(col,freq){
  pulseCol=col;pulseFq=freq;
  const el=document.getElementById('pulse');
  if(pulseFq<=0){el.style.background=pulseCol;return;}
  const start=performance.now();
  function frame(ts){
    const t=(ts-start)/1000;
    const a=.5+.5*Math.sin(2*Math.PI*pulseFq*t);
    el.style.background=pulseCol;el.style.opacity=a;
    pulseAF=requestAnimationFrame(frame);
  }
  pulseAF=requestAnimationFrame(frame);
}
function stopPulse(){if(pulseAF)cancelAnimationFrame(pulseAF);document.getElementById('pulse').style.opacity=1;}

// ─── APP STATE ─────────────────────────────────────────────
const path=window.location.pathname;
const params=new URLSearchParams(window.location.search);
const stateId=path.split('/').filter(Boolean).pop()||'first-contact';
const lang=params.get('lang')||(navigator.language||'en').slice(0,2);
const ref=params.get('ref');
const L=T[lang]||T.en;
const st=S[stateId]||S['first-contact'];
let elapsed=0,timer=null,paused=false,phaseTimers=[],holdTimer=null;

// ─── SESSION LIMIT ─────────────────────────────────────────
function todayKey(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function isLimited(){
  if(st.pro)return false;
  const k=`cx_last_${stateId}`;
  const last=localStorage.getItem(k);
  if(!last)return false;
  return last===todayKey();
}
function markUsed(){if(!st.pro)localStorage.setItem(`cx_last_${stateId}`,todayKey());}

// ─── INIT LANDING ──────────────────────────────────────────
function initLanding(){
  document.title=`${st.n[lang]||st.n.en} — Cyberneom`;
  document.getElementById('og-title').content=document.title;
  document.getElementById('og-desc').content=st.d[lang]||st.d.en;
  document.getElementById('tw-title').content=document.title;
  document.getElementById('tw-desc').content=st.d[lang]||st.d.en;
  document.documentElement.lang=lang;

  document.getElementById('stateIcon').textContent=st.ic;
  document.getElementById('stateName').textContent=st.n[lang]||st.n.en;
  document.getElementById('stateDesc').textContent=st.d[lang]||st.d.en;
  document.getElementById('hintHeadphones').textContent=L.headphones;
  document.getElementById('hintEyes').textContent=L.eyes;
  if(st.spk){document.getElementById('hintSpeakers').style.display='flex';document.getElementById('hintSpeakersText').textContent=L.speakers;}

  const wrap=document.getElementById('beginWrap');
  if(isLimited()){
    wrap.innerHTML=`<p class="limit-msg">${L.limit}</p><button class="pro-btn" onclick="window.open('https://cyberneom.xyz/planes-de-suscripcion','_blank')">${L.unlockPro}</button>`;
  }else{
    const txtCol=luminance(st.col)>.5?'#000':'#fff';
    wrap.innerHTML=`<button class="begin-btn" style="background:${st.col};color:${txtCol}" onclick="begin()">${L.begin}</button>`;
  }

  // Analytics (fire & forget)
  const fields={total:1,[`today_${todayKey()}`]:1};
  fbInc(stateId,fields);
  if(ref)fbInc(stateId,{[`refs.${ref}`]:1});

  // Social proof
  fbGet(stateId).then(n=>{
    if(n>0)document.getElementById('socialProof').textContent=`${fmtCount(n)} ${L.people}`;
  });
}

// ─── BEGIN ─────────────────────────────────────────────────
function begin(){
  show('player');
  audioPlay(st.lf,st.rf);
  startPulse(st.col,st.pf||0);
  markUsed();
  elapsed=0;
  document.getElementById('stopHint').textContent=L.stop;
  updateTimer();
  timer=setInterval(()=>{
    if(!paused){elapsed++;updateTimer();if(elapsed>=st.dur)complete();}
  },1000);
  // Schedule phases
  if(st.ph){
    st.ph.forEach(p=>{
      const t=setTimeout(()=>{
        audioUpdate(p.lf,p.rf);
        stopPulse();startPulse(p.col,p.pf||0);
      },p.t*1000);
      phaseTimers.push(t);
    });
  }
  fbInc(stateId,{[`starts_${todayKey()}`]:1});

  // Tap = pause, hold = stop
  const pl=document.getElementById('player');
  pl.onclick=()=>{paused=!paused;document.getElementById('pauseIcon').classList.toggle('show',paused);};
  pl.onpointerdown=()=>{holdTimer=setTimeout(()=>complete(),800);};
  pl.onpointerup=()=>{clearTimeout(holdTimer);};
  pl.onpointerleave=()=>{clearTimeout(holdTimer);};
}

function updateTimer(){
  const rem=st.dur-elapsed;
  const m=String(Math.floor(rem/60)).padStart(2,'0');
  const s=String(rem%60).padStart(2,'0');
  document.getElementById('timerText').textContent=`${m}:${s}`;
  document.getElementById('progressBar').style.width=`${(elapsed/st.dur)*100}%`;
  document.getElementById('progressBar').style.background=st.col;
}

// ─── COMPLETE ──────────────────────────────────────────────
async function complete(){
  clearInterval(timer);phaseTimers.forEach(clearTimeout);
  await audioFadeStop();
  stopPulse();
  document.getElementById('pulse').style.background='#000';document.getElementById('pulse').style.opacity=1;
  fbInc(stateId,{[`completions_${todayKey()}`]:1});
  initAfterglow();
  show('afterglow');
}

function initAfterglow(){
  document.getElementById('feelText').textContent=L.feel;
  const row=document.getElementById('emojiRow');
  row.innerHTML='';
  ['\uD83D\uDE0C','\uD83D\uDE0A','\uD83E\uDD2F','\uD83D\uDE34'].forEach(e=>{
    const sp=document.createElement('span');sp.textContent=e;
    sp.onclick=()=>{fbInc(stateId,{[`emotions.${e}`]:1});sp.style.transform='scale(1.3)';};
    row.appendChild(sp);
  });
  document.getElementById('shareText').textContent=L.share;
  document.getElementById('shareBtn').onclick=()=>{
    fbInc(stateId,{shares:1});
    const url=`https://cyberneom.xyz/x/${stateId}`;
    const msg=L.shareMsg.replace('{n}',st.n[lang]||st.n.en).replace('{u}',url);
    if(navigator.share)navigator.share({text:msg,url}).catch(()=>{});
    else navigator.clipboard?.writeText(msg);
  };
  document.getElementById('exploreBtn').textContent=L.explore;
  document.getElementById('exploreBtn').onclick=()=>{window.location.href='/statesExplore';};
  // PRO upsell for free states
  if(!st.pro){
    const box=document.getElementById('proBox');box.style.display='block';
    document.getElementById('proText').textContent=L.unlock;
    document.getElementById('proBtn').textContent=L.gopro;
    document.getElementById('proBtn').onclick=()=>window.open('https://cyberneom.xyz/planes-de-suscripcion','_blank');
  }
}

// ─── UTIL ──────────────────────────────────────────────────
function show(id){document.querySelectorAll('.step').forEach(e=>e.classList.remove('active'));document.getElementById(id).classList.add('active');}
function fmtCount(n){if(n>=1e6)return(n/1e6).toFixed(1)+'M';if(n>=1e3)return(n/1e3).toFixed(1)+'K';return String(n);}
function luminance(hex){const r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;return .299*r+.587*g+.114*b;}

// ─── GO ────────────────────────────────────────────────────
initLanding();
</script>
