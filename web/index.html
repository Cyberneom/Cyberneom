<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Cyberneom — Frequency experiences for focus, sleep, calm, and meditation. Put on headphones, close your eyes.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Resource hints: speed up Firebase & font connections -->
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://www.googleapis.com" crossorigin>
  <link rel="dns-prefetch" href="https://fonts.gstatic.com">
  <link rel="dns-prefetch" href="https://firebasestorage.googleapis.com">

  <!-- Open Graph -->
  <meta property="og:title" content="Cyberneom — Frequency Orchestration">
  <meta property="og:description" content="Sound, light, and frequency experiences. Focus, sleep, calm, meditate — put on headphones and feel it.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://cyberneom.xyz">
  <meta property="og:site_name" content="Cyberneom">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Cyberneom — Frequency Orchestration">
  <meta name="twitter:description" content="Sound, light, and frequency experiences. Put on headphones and feel it.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="cyberneom">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Cyberneom</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
