<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Cyberneom — Frequency experiences for focus, sleep, calm, and meditation. Put on headphones, close your eyes.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Resource hints: speed up Firebase & font connections -->
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://www.googleapis.com" crossorigin>
  <link rel="dns-prefetch" href="https://fonts.gstatic.com">
  <link rel="dns-prefetch" href="https://firebasestorage.googleapis.com">

  <!-- Open Graph -->
  <meta property="og:title" content="Cyberneom — Frequency Orchestration">
  <meta property="og:description" content="Sound, light, and frequency experiences. Focus, sleep, calm, meditate — put on headphones and feel it.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://cyberneom.xyz">
  <meta property="og:site_name" content="Cyberneom">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Cyberneom — Frequency Orchestration">
  <meta name="twitter:description" content="Sound, light, and frequency experiences. Put on headphones and feel it.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="cyberneom">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Cyberneom</title>
  <link rel="manifest" href="manifest.json">

  <!-- Preconnect to critical origins -->
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://www.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://firebasestorage.googleapis.com" crossorigin>
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">

  <!-- Outfit Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">

  <!-- pdf.js for pdfx plugin (deferred — not blocking) -->
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.4.120/build/pdf.min.js" type="text/javascript" defer></script>
  <script type="text/javascript">
      document.addEventListener('DOMContentLoaded', function() {
        if (typeof pdfjsLib !== 'undefined') {
          pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.4.120/build/pdf.worker.min.js";
        }
      });
  </script>
  
  <style>
    /* Absolute reset for the premium dark splash */
    #loading-splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #070707;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 999999;
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      overflow: hidden;
      user-select: none;
    }

    .splash-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    /* Central Pulsing Cyan Obsidian Orb */
    .pulsing-orb-outer {
      position: relative;
      width: 90px;
      height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 28px;
    }

    .obsidian-ring {
      position: absolute;
      width: 86px;
      height: 86px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 50%;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
      animation: rotateRing 8s linear infinite;
    }

    @keyframes rotateRing {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .app-core-logo {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background-image: url('icons/Icon-192.png');
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
      box-shadow: 0 0 30px rgba(0, 229, 255, 0.4), 
                  0 0 60px rgba(0, 229, 255, 0.15);
      animation: pulseCore 2.5s infinite ease-in-out;
    }

    @keyframes pulseCore {
      0% {
        transform: scale(0.92);
        box-shadow: 0 0 25px rgba(0, 229, 255, 0.4), 0 0 50px rgba(0, 229, 255, 0.15);
      }
      50% {
        transform: scale(1.05);
        box-shadow: 0 0 45px rgba(0, 229, 255, 0.8), 0 0 90px rgba(0, 229, 255, 0.35);
      }
      100% {
        transform: scale(0.92);
        box-shadow: 0 0 25px rgba(0, 229, 255, 0.4), 0 0 50px rgba(0, 229, 255, 0.15);
      }
    }

    /* Typographic Brand */
    .splash-title {
      color: #FFFFFF;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 4px;
      margin: 0 0 8px 0;
      text-transform: uppercase;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    }

    .splash-subtitle {
      color: rgba(255, 255, 255, 0.4);
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.5px;
      margin: 0;
      animation: pulseText 2s infinite ease-in-out;
    }

    @keyframes pulseText {
      0% { opacity: 0.6; }
      50% { opacity: 0.95; }
      100% { opacity: 0.6; }
    }

    /* Glowing Elegant Progress Bar */
    .progress-track {
      width: 120px;
      height: 2px;
      background-color: rgba(255, 255, 255, 0.05);
      border-radius: 1px;
      overflow: hidden;
      margin-top: 24px;
      position: relative;
    }

    .progress-fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #00E5FF, #00E676);
      box-shadow: 0 0 8px rgba(0, 229, 255, 0.5);
      border-radius: 1px;
      animation: simulateProgress 4.5s ease-out forwards;
      transform-origin: left;
    }

    @keyframes simulateProgress {
      0% { transform: scaleX(0); }
      15% { transform: scaleX(0.12); }
      40% { transform: scaleX(0.45); }
      60% { transform: scaleX(0.72); }
      85% { transform: scaleX(0.92); }
      100% { transform: scaleX(0.98); }
    }
  </style>
</head>
<body>
  <!-- Premium Dark Splash Screen for Cyberneom -->
  <div id="loading-splash">
    <div class="splash-container">
      <div class="pulsing-orb-outer">
        <div class="obsidian-ring"></div>
        <div class="app-core-logo"></div>
      </div>
      <h1 class="splash-title">Cyberneom</h1>
      <p class="splash-subtitle">Orquestando frecuencias...</p>
      <div class="progress-track">
        <div class="progress-fill"></div>
      </div>
    </div>
  </div>

  <script>
    (function() {
      // Define global method to be called from Flutter to dismiss splash
      window.hideLoadingSplash = function() {
        var splash = document.getElementById('loading-splash');
        if (splash) {
          splash.style.transition = 'opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1)';
          splash.style.opacity = '0';
          splash.style.pointerEvents = 'none';
          setTimeout(function() {
            splash.remove();
          }, 800);
        }
      };

      // Hide loader after Flutter mounts.
      window.addEventListener('flutter-first-frame', function() {
        window.hideLoadingSplash();
      });

      // Safety timeout: remove splash after 25 seconds if boot fails to avoid blocking the user
      setTimeout(function() {
        window.hideLoadingSplash();
      }, 25000);
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
